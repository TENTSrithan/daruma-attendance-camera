<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DARUMA — ถ่ายรูปลงเวลา</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f5;color:#18181b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{background:linear-gradient(135deg,#7f1d1d,#dc2626);color:white;padding:22px}.wrap{max-width:520px;margin:18px auto;padding:0 14px}.card{background:white;border-radius:20px;padding:18px;box-shadow:0 5px 20px #0001}h1{font-size:21px;margin:0}p{line-height:1.5}.muted{color:#71717a;font-size:13px}.cam{width:100%;max-height:60vh;object-fit:cover;background:#18181b;border-radius:14px;margin-top:12px}button{width:100%;padding:15px;border:0;border-radius:13px;font:inherit;font-weight:800;margin-top:10px;background:#b91c1c;color:white}.secondary{background:#e4e4e7;color:#18181b}.hidden{display:none!important}.msg{padding:12px;border-radius:12px;background:#fee2e2;margin-top:12px}
</style></head><body><header class="top"><h1>DARUMA PART-TIME ATTENDANCE</h1><div>ถ่ายรูปยืนยันการลงเวลา</div></header><main class="wrap"><section class="card"><h2 id="employee">กำลังตรวจสอบรายการ…</h2><p id="act" class="muted"></p><p>ตรวจสอบชื่อให้ถูกต้องก่อนถ่ายรูป และอนุญาตให้ Safari ใช้กล้อง</p><video id="video" class="cam" autoplay playsinline muted></video><canvas id="canvas" class="hidden"></canvas><img id="preview" class="cam hidden" alt="ภาพตัวอย่าง"><button id="start">เปิดกล้อง</button><button id="capture" class="hidden">📸 ถ่ายรูป</button><button id="retake" class="secondary hidden">ถ่ายใหม่</button><button id="submit" class="hidden">ยืนยันและบันทึก</button><div id="msg" class="msg hidden"></div><p class="muted">ระบบจะส่งรูปไปบันทึกใน Google Drive พร้อมเวลาใน Google Sheets</p></section></main>
<script>
const q=new URLSearchParams(location.search),token=q.get('token')||'',employeeId=q.get('employeeId')||'',action=q.get('action')||'',name=q.get('name')||'',postUrl=q.get('postUrl')||'';
const labels={CLOCK_IN:'เข้างาน',BREAK_START:'เข้าพัก',BREAK_END:'ออกจากพัก',CLOCK_OUT:'เลิกงาน'};
const $=id=>document.getElementById(id);let stream=null,photo=null;
$('employee').textContent=name||'ไม่พบชื่อพนักงาน';$('act').textContent=labels[action]||'รายการไม่ถูกต้อง';
function show(t){$('msg').textContent=t;$('msg').classList.remove('hidden')}
async function start(){try{if(!token||!employeeId||!labels[action]||!postUrl.startsWith('https://script.google.com/'))throw Error('ลิงก์ไม่ถูกต้อง กรุณากลับไปหน้าลงเวลา');if(!navigator.mediaDevices?.getUserMedia)throw Error('Safari ไม่รองรับการเปิดกล้องในหน้านี้ กรุณาใช้ HTTPS บน Safari');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});$('video').srcObject=stream;await $('video').play();$('start').classList.add('hidden');$('capture').classList.remove('hidden')}catch(e){show('เปิดกล้องไม่ได้: '+e.message)}}
function capture(){const v=$('video');if(!v.videoWidth)return show('กล้องยังไม่พร้อม กรุณารอสักครู่');const c=$('canvas'),scale=Math.min(1,1000/v.videoWidth);c.width=Math.round(v.videoWidth*scale);c.height=Math.round(v.videoHeight*scale);c.getContext('2d').drawImage(v,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.75);$('preview').src=photo;$('preview').classList.remove('hidden');v.classList.add('hidden');$('capture').classList.add('hidden');$('retake').classList.remove('hidden');$('submit').classList.remove('hidden');if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function retake(){photo=null;$('preview').classList.add('hidden');$('video').classList.remove('hidden');$('retake').classList.add('hidden');$('submit').classList.add('hidden');start()}
function submit(){if(!photo)return show('กรุณาถ่ายรูปก่อน');$('submit').disabled=true;$('submit').textContent='กำลังบันทึก…';const f=document.createElement('form');f.method='POST';f.action=postUrl;f.enctype='application/x-www-form-urlencoded';[['token',token],['employeeId',employeeId],['action',action],['imageData',photo]].forEach(([k,v])=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;f.appendChild(i)});document.body.appendChild(f);f.submit()}
$('start').addEventListener('click',start);$('capture').addEventListener('click',capture);$('retake').addEventListener('click',retake);$('submit').addEventListener('click',submit);
</script></body></html>
